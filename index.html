<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>考研题库 · 西综/政治/英语</title>
  <style>
    :root {
      --bg: #e8f4f8;
      --card-bg: rgba(255,255,255,0.75);
      --card-shadow: 0 8px 32px rgba(0,50,80,0.08);
      --banner-bg: linear-gradient(135deg,#b3d9f0,#d4e9fa);
      --banner-text: #034b7a;
      --banner-sub: #1f6390;
      --countdown-bg: rgba(255,255,255,0.7);
      --countdown-text: #034b7a;
      --filter-bg: white;
      --filter-border: rgba(180,210,230,0.3);
      --filter-label: #2a5f7a;
      --filter-input-bg: #f7fbfe;
      --filter-input-border: #cfe0eb;
      --btn-primary-bg: #4a8ab5;
      --btn-primary-border: #3a7aa5;
      --btn-success-bg: #3e9b7c;
      --btn-success-border: #2e8b6c;
      --btn-outline-border: #7fb0cc;
      --btn-outline-color: #1f6390;
      --btn-danger-bg: #c0392b;
      --list-bg: white;
      --list-border: rgba(180,210,230,0.3);
      --q-header-tag-bg: #e1eff7;
      --q-header-tag-color: #034b7a;
      --q-type-bg: #c7e0eb;
      --q-type-color: #135b7a;
      --q-text-border: #b3d9f0;
      --opt-bg: #f7fbfe;
      --opt-border: #cfe0eb;
      --opt-selected-bg: #d4e9fa;
      --opt-correct-bg: #c8f0d8;
      --opt-wrong-bg: #fdd;
      --modal-bg: white;
      --modal-overlay: rgba(0,30,50,0.4);
      --text-primary: #1a3a4a;
      --text-secondary: #6f8fa0;
      --form-bg: #f7fbfe;
      --options-editor-bg: #f2f8fc;
      --sub-row-bg: #f7fbfe;
      --sub-row-border: #d4e4ed;
    }

    body.dark {
      --bg: #0d1b2a;
      --card-bg: rgba(20,30,45,0.9);
      --card-shadow: 0 8px 32px rgba(0,0,0,0.5);
      --banner-bg: linear-gradient(135deg,#1b2838,#243447);
      --banner-text: #a8d0e6;
      --banner-sub: #6ba3c9;
      --countdown-bg: rgba(255,255,255,0.1);
      --countdown-text: #a8d0e6;
      --filter-bg: #1b2838;
      --filter-border: rgba(100,150,200,0.2);
      --filter-label: #8bb3cc;
      --filter-input-bg: #243447;
      --filter-input-border: #3a506b;
      --btn-primary-bg: #3a7aa5;
      --btn-primary-border: #2a6a95;
      --btn-success-bg: #2e8b6c;
      --btn-success-border: #1e7b5c;
      --btn-outline-border: #5a8aa0;
      --btn-outline-color: #8bb3cc;
      --btn-danger-bg: #a93226;
      --list-bg: #1b2838;
      --list-border: rgba(100,150,200,0.15);
      --q-header-tag-bg: #2a3f54;
      --q-header-tag-color: #a8d0e6;
      --q-type-bg: #2e4a62;
      --q-type-color: #8bb3cc;
      --q-text-border: #3a5a7a;
      --opt-bg: #243447;
      --opt-border: #3a506b;
      --opt-selected-bg: #2e4a62;
      --opt-correct-bg: #1e4a3a;
      --opt-wrong-bg: #4a2a2a;
      --modal-bg: #1b2838;
      --modal-overlay: rgba(0,20,30,0.7);
      --text-primary: #dceeff;
      --text-secondary: #7f9faf;
      --form-bg: #243447;
      --options-editor-bg: #1e2e40;
      --sub-row-bg: #1e2e40;
      --sub-row-border: #3a506b;
      color-scheme: dark;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); padding: 12px; min-height: 100vh; color: var(--text-primary); }
    .container { max-width: 1100px; margin: 0 auto; background: var(--card-bg); backdrop-filter: blur(4px); border-radius: 24px; padding: 16px 16px 24px; box-shadow: var(--card-shadow); }

    .banner { background: var(--banner-bg); border-radius: 16px; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.6); }
    .banner h1 { font-size: 18px; font-weight: 600; color: var(--banner-text); display: flex; align-items: center; gap: 8px; }
    .banner h1 small { font-size: 14px; font-weight: 400; color: var(--banner-sub); background: rgba(255,255,255,0.5); padding: 2px 12px; border-radius: 40px; }
    .banner-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .countdown { background: var(--countdown-bg); padding: 6px 18px; border-radius: 40px; font-size: 16px; font-weight: 600; color: var(--countdown-text); border: 1px solid rgba(255,255,255,0.6); white-space: nowrap; }
    .theme-toggle { background: none; border: none; font-size: 24px; cursor: pointer; padding: 4px; border-radius: 50%; transition: 0.2s; }
    .theme-toggle:hover { background: rgba(255,255,255,0.2); }

    .filter-bar { background: var(--filter-bg); padding: 14px 16px; border-radius: 16px; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; box-shadow: 0 2px 12px rgba(0,40,70,0.04); border: 1px solid var(--filter-border); margin-bottom: 16px; }
    .filter-group { display: flex; flex-direction: column; gap: 4px; flex: 1 0 130px; }
    .filter-group label { font-size: 13px; font-weight: 500; color: var(--filter-label); }
    .filter-group select, .filter-group input { padding: 10px 12px; border-radius: 40px; border: 1px solid var(--filter-input-border); background: var(--filter-input-bg); font-size: 15px; outline: none; color: var(--text-primary); }
    .filter-group select { -webkit-appearance: none; appearance: none; background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2220%22%20height%3D%2220%22%3E%3Cpath%20d%3D%22M5%206l5%205%205-5%22%20stroke%3D%22%23333%22%20stroke-width%3D%222%22%20fill%3D%22none%22/%3E%3C/svg%3E"); background-repeat: no-repeat; background-position: right 10px center; background-size: 16px; padding-right: 30px; }
    .filter-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; width: 100%; }
    .filter-actions button, .filter-actions .btn { flex: 1 1 auto; min-height: 44px; }
    .search-box { position: relative; flex: 2 0 200px; }
    .search-box input { width: 100%; padding: 10px 16px 10px 40px; border-radius: 40px; border: 1px solid var(--filter-input-border); background: var(--filter-input-bg); font-size: 15px; }
    .search-box .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--filter-label); font-size: 18px; }

    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .toolbar .btn { min-height: 44px; }

    .btn { padding: 8px 18px; border: none; border-radius: 40px; font-size: 15px; font-weight: 500; cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px; justify-content: center; background: transparent; }
    .btn-primary { background: var(--btn-primary-bg); color: white; border: 1px solid var(--btn-primary-border); }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-success { background: var(--btn-success-bg); color: white; border: 1px solid var(--btn-success-border); }
    .btn-outline { border: 1px solid var(--btn-outline-border); color: var(--btn-outline-color); }
    .btn-outline:hover { background: rgba(100,150,200,0.1); }
    .btn-danger { background: var(--btn-danger-bg); color: white; border: 1px solid #a93226; }
    .btn-active { background: #4a8ab5; color: white !important; }

    .question-list { background: var(--list-bg); border-radius: 16px; padding: 16px 16px 24px; box-shadow: 0 2px 12px rgba(0,40,70,0.04); border: 1px solid var(--list-border); min-height: 150px; }
    .question-list h2 { font-size: 17px; font-weight: 500; color: var(--banner-text); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .question-item { border-bottom: 1px solid var(--list-border); padding: 14px 0; }
    .question-item:last-child { border-bottom: none; }

    .q-header { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
    .q-tag { background: var(--q-header-tag-bg); color: var(--q-header-tag-color); padding: 2px 12px; border-radius: 40px; font-size: 12px; font-weight: 500; }
    .q-type { background: var(--q-type-bg); color: var(--q-type-color); font-weight: 600; padding: 2px 10px; border-radius: 30px; font-size: 12px; }
    .q-subject { color: var(--filter-label); font-weight: 500; font-size: 13px; }
    .q-chapter { color: var(--text-secondary); font-size: 12px; }

    .q-text { margin: 6px 0 8px; font-size: 16px; line-height: 1.5; padding-left: 10px; border-left: 3px solid var(--q-text-border); }

    .q-options { display: flex; flex-direction: column; gap: 8px; margin: 8px 0; }
    .q-options button { width: 100%; padding: 12px 16px; border-radius: 40px; border: 2px solid var(--opt-border); background: var(--opt-bg); font-size: 15px; cursor: pointer; transition: 0.15s; color: var(--text-primary); text-align: left; }
    .q-options button:active { filter: brightness(0.95); }
    .q-options button.selected { border-color: var(--btn-primary-bg); background: var(--opt-selected-bg); }
    .q-options button.correct { border-color: #2e8b6c; background: var(--opt-correct-bg); }
    .q-options button.wrong { border-color: #b33; background: var(--opt-wrong-bg); }

    .q-result { margin-top: 6px; font-weight: 600; font-size: 14px; }
    .q-result.correct { color: #2e8b6c; }
    .q-result.wrong { color: #b33; }
    .q-answer-display { margin-top: 6px; font-size: 13px; color: var(--banner-text); background: rgba(100,150,200,0.15); padding: 4px 12px; border-radius: 30px; display: inline-block; }
    .q-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .note-indicator { font-size: 14px; margin-left: 4px; }

    .empty-msg { color: var(--text-secondary); text-align: center; padding: 40px 0; }

    /* 模态框通用 */
    .modal-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: var(--modal-overlay); backdrop-filter: blur(3px); align-items: center; justify-content: center; z-index: 1000; }
    .modal-overlay.active { display: flex; padding: 12px; }
    .modal-box { background: var(--modal-bg); border-radius: 24px; max-width: 700px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 24px 20px 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); color: var(--text-primary); }
    .modal-box h2 { font-size: 20px; color: var(--banner-text); margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    .close-btn { background: none; border: none; font-size: 28px; cursor: pointer; color: var(--text-secondary); }
    .form-row { display: flex; flex-wrap: wrap; gap: 10px 12px; margin-bottom: 12px; }
    .form-group { flex: 1 0 160px; display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 13px; font-weight: 500; color: var(--filter-label); }
    .form-group input, .form-group select, .form-group textarea { padding: 10px 14px; border-radius: 40px; border: 1px solid var(--filter-input-border); background: var(--form-bg); font-size: 14px; outline: none; color: var(--text-primary); }
    .form-group textarea { border-radius: 16px; min-height: 50px; }
    .options-editor { background: var(--options-editor-bg); border-radius: 16px; padding: 14px 16px; margin: 8px 0 12px; border: 1px solid var(--sub-row-border); }
    .opt-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .opt-row input { flex: 1; padding: 10px 14px; border-radius: 40px; border: 1px solid var(--filter-input-border); background: var(--form-bg); color: var(--text-primary); }
    .opt-row button { background: none; border: none; color: #b33; font-size: 22px; cursor: pointer; padding: 0 4px; min-height: 44px; }
    .add-opt-btn { background: var(--btn-primary-bg); border: none; border-radius: 40px; padding: 6px 16px; font-size: 14px; cursor: pointer; color: white; min-height: 44px; }

    .sub-questions-area { margin: 10px 0; border-top: 1px dashed var(--sub-row-border); padding-top: 12px; }
    .sub-question-row { background: var(--sub-row-bg); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; border: 1px solid var(--sub-row-border); }
    .sub-question-row .sq-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .sub-question-row textarea { width: 100%; border-radius: 12px; border: 1px solid var(--filter-input-border); padding: 8px 12px; font-size: 14px; background: var(--form-bg); color: var(--text-primary); }
    .sq-answers { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 6px; }

    .confirm-dialog { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--modal-bg); border-radius: 20px; padding: 20px 24px; box-shadow: 0 16px 48px rgba(0,0,0,0.3); z-index: 2000; display: flex; flex-direction: column; gap: 12px; max-width: 320px; width: 90%; }

    /* 测验模式 */
    .quiz-container { display: flex; flex-direction: column; height: 100%; }
    .quiz-progress { font-size: 14px; margin-bottom: 12px; }
    .quiz-question { flex: 1; }
    .quiz-actions { display: flex; gap: 8px; margin-top: 16px; justify-content: center; }
    .quiz-result { text-align: center; padding: 20px; }
  </style>
</head>
<body>
<div class="container">
  <div class="banner">
    <h1>📚 考研题库 <small>西综 · 政治 · 英语</small></h1>
    <div class="banner-right">
      <button class="theme-toggle" id="themeToggle" aria-label="切换夜间模式">🌙</button>
      <div class="countdown">⏳ 距考研 <span id="daysLeft">--</span> 天</div>
    </div>
  </div>

  <div class="filter-bar">
    <div class="filter-group"><label>📌 科目</label><select id="subjectFilter"><option value="">全部</option><option value="西医综合">西医综合</option><option value="政治">政治</option><option value="英语">英语</option></select></div>
    <div class="filter-group"><label>📂 二级分类</label><select id="subFilter"><option value="">全部</option></select></div>
    <div class="filter-group"><label>📖 章节</label><select id="chapterFilter"><option value="">全部</option></select></div>
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="搜索题目内容...">
    </div>
    <div class="filter-actions">
      <button class="btn btn-primary" id="filterBtn">筛选</button>
      <button class="btn btn-success" id="addBtn">➕ 录入</button>
    </div>
  </div>

  <div class="toolbar">
    <button class="btn btn-outline" id="wrongModeBtn">📕 错题本</button>
    <button class="btn btn-outline" id="favModeBtn">⭐ 收藏</button>
    <button class="btn btn-outline" id="randomQuizBtn">🎲 随机练习</button>
    <button class="btn btn-outline" id="exportBtn">📤 导出</button>
    <button class="btn btn-outline" id="importBtn">📥 导入</button>
  </div>

  <div class="question-list">
    <h2><span>📝 题目列表</span><span id="resultCount">0 道题</span></h2>
    <div id="questionsContainer"><div class="empty-msg">加载中...</div></div>
  </div>
</div>

<!-- 录入模态框 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box"> <!-- 内容由JS动态生成，不变 --> </div>
</div>

<!-- 笔记模态框 -->
<div class="modal-overlay" id="noteModalOverlay">
  <div class="modal-box">
    <h2>📝 题目笔记 <button class="close-btn" id="closeNoteModal">×</button></h2>
    <textarea id="noteTextarea" rows="6" style="width:100%; border-radius:12px; padding:12px; border:1px solid #cfe0eb; background:var(--form-bg); color:var(--text-primary);"></textarea>
    <div class="form-actions"><button class="btn btn-primary" id="saveNoteBtn">保存笔记</button></div>
  </div>
</div>

<!-- 随机练习模态框 -->
<div class="modal-overlay" id="quizModalOverlay">
  <div class="modal-box" id="quizModalBox">
    <!-- 动态填充 -->
  </div>
</div>

<!-- 导入文件选择器（隐藏） -->
<input type="file" id="importFileInput" accept=".json" style="display:none;">

<script>
  (function() {
    // ===================== 全局状态 =====================
    let allQuestions = [];          // 全量题目缓存（用于错题/收藏/随机）
    let questions = [];            // 当前展示的题目
    const answerState = {};
    let wrongSet = new Set(JSON.parse(localStorage.getItem('wrongSet') || '[]'));
    let favSet = new Set(JSON.parse(localStorage.getItem('favSet') || '[]'));
    let notes = JSON.parse(localStorage.getItem('questionNotes') || '{}');
    let currentMode = 'all';       // 'all', 'wrong', 'favorite'
    let searchTerm = '';
    let isQuizMode = false;

    // 夜间模式
    const themeToggle = document.getElementById('themeToggle');
    function applyTheme() {
      if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark');
        themeToggle.textContent = '☀️';
      } else {
        document.body.classList.remove('dark');
        themeToggle.textContent = '🌙';
      }
    }
    themeToggle.addEventListener('click', () => {
      if (document.body.classList.contains('dark')) {
        localStorage.setItem('theme', 'light');
      } else {
        localStorage.setItem('theme', 'dark');
      }
      applyTheme();
    });
    applyTheme();

    // 持久化
    function saveLocalData() {
      localStorage.setItem('wrongSet', JSON.stringify([...wrongSet]));
      localStorage.setItem('favSet', JSON.stringify([...favSet]));
      localStorage.setItem('questionNotes', JSON.stringify(notes));
    }

    // ===================== API 封装 =====================
    async function fetchQuestions(filters = {}) {
      const params = new URLSearchParams(filters);
      const res = await fetch(`/api/questions?${params.toString()}`);
      if (!res.ok) throw new Error(`加载失败: ${res.status}`);
      return await res.json();
    }

    async function saveQuestionsToAPI(questionsArray) {
      const res = await fetch('/api/questions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(questionsArray),
      });
      if (!res.ok) throw new Error(`保存失败: ${res.status}`);
      return await res.json();
    }

    async function deleteQuestion(id) {
      const res = await fetch(`/api/questions?id=${id}`, { method: 'DELETE' });
      if (!res.ok) throw new Error('删除失败');
    }

    // ===================== 加载与筛选 =====================
    async function loadAllQuestions() {
      try {
        allQuestions = await fetchQuestions({});
      } catch (e) {
        console.error('加载全量题库失败', e);
        allQuestions = [];
      }
    }

    function getFilteredQuestions() {
      let source = [];
      if (currentMode === 'wrong') {
        source = allQuestions.filter(q => wrongSet.has(q.id));
      } else if (currentMode === 'favorite') {
        source = allQuestions.filter(q => favSet.has(q.id));
      } else {
        // 普通模式，基于筛选条件从allQuestions中过滤（也可以重新拉取，这里用allQuestions减少请求）
        const subject = document.getElementById('subjectFilter').value;
        const subCategory = document.getElementById('subFilter').value;
        const chapter = document.getElementById('chapterFilter').value;
        source = allQuestions.filter(q => {
          if (subject && q.subject !== subject) return false;
          if (subCategory && q.subCategory !== subCategory) return false;
          if (chapter && q.chapter !== chapter) return false;
          return true;
        });
      }
      // 搜索过滤
      if (searchTerm) {
        const term = searchTerm.toLowerCase();
        source = source.filter(q => 
          q.question.toLowerCase().includes(term) ||
          q.options.some(opt => opt.toLowerCase().includes(term))
        );
      }
      return source;
    }

    async function refreshQuestions() {
      // 如果全量数据为空则先加载
      if (allQuestions.length === 0) await loadAllQuestions();
      questions = getFilteredQuestions();
      renderQuestions();
    }

    // 筛选按钮点击
    document.getElementById('filterBtn').addEventListener('click', async () => {
      currentMode = 'all';
      updateModeButtons();
      searchTerm = document.getElementById('searchInput').value.trim();
      await refreshQuestions();
    });

    // 实时搜索（防抖）
    let searchTimeout;
    document.getElementById('searchInput').addEventListener('input', function() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(async () => {
        searchTerm = this.value.trim();
        await refreshQuestions();
      }, 400);
    });

    // 模式切换按钮
    function updateModeButtons() {
      document.getElementById('wrongModeBtn').classList.toggle('btn-active', currentMode === 'wrong');
      document.getElementById('favModeBtn').classList.toggle('btn-active', currentMode === 'favorite');
    }

    document.getElementById('wrongModeBtn').addEventListener('click', async () => {
      currentMode = currentMode === 'wrong' ? 'all' : 'wrong';
      updateModeButtons();
      await refreshQuestions();
    });
    document.getElementById('favModeBtn').addEventListener('click', async () => {
      currentMode = currentMode === 'favorite' ? 'all' : 'favorite';
      updateModeButtons();
      await refreshQuestions();
    });

    // ===================== 渲染题目 =====================
    function renderQuestions() {
      const container = document.getElementById('questionsContainer');
      document.getElementById('resultCount').textContent = questions.length + ' 道题';
      if (questions.length === 0) {
        container.innerHTML = '<div class="empty-msg">没有匹配的题目。</div>';
        return;
      }

      let html = '';
      questions.forEach(q => {
        const typeLabel = q.type === 'A' ? 'A型' : q.type === 'X' ? 'X型' : 'B型';
        const optionsHtml = q.options.map((opt, idx) => {
          const letter = String.fromCharCode(65 + idx);
          return `<button data-qid="${q.id}" data-optidx="${idx}" class="opt-btn">${letter}. ${opt}</button>`;
        }).join('');
        const state = answerState[q.id] || { selected: [], submitted: false };
        const submitted = state.submitted || false;
        let resultHtml = '';
        if (submitted) {
          const correct = q.answer.slice().sort();
          const user = (state.selected || []).slice().sort();
          const isCorrect = correct.length === user.length && correct.every((v, i) => v === user[i]);
          resultHtml = `<div class="q-result ${isCorrect ? 'correct' : 'wrong'}">${isCorrect ? '✅ 回答正确！' : '❌ 回答错误'}</div>`;
          resultHtml += `<div class="q-answer-display">✅ 正确答案：${q.answer.map(i => String.fromCharCode(65 + i)).join('、')}</div>`;
        }
        const isFav = favSet.has(q.id);
        const noteText = notes[q.id] ? '📝' : '';
        html += `
          <div class="question-item" data-qid="${q.id}">
            <div class="q-header">
              <span class="q-tag">${q.subject}</span>
              <span class="q-subject">${q.subCategory || '未分类'}</span>
              <span class="q-chapter">${q.chapter || '无章节'}</span>
              <span class="q-type">${typeLabel}</span>
            </div>
            <div class="q-text">${q.question} ${noteText}</div>
            <div class="q-options" data-qid="${q.id}">${optionsHtml}</div>
            <div class="q-actions">
              <button class="btn btn-primary submit-answer" data-qid="${q.id}">📤 提交答案</button>
              ${submitted ? `<button class="btn btn-outline reset-answer" data-qid="${q.id}">🔄 重做</button>` : ''}
              <button class="btn btn-outline fav-toggle" data-qid="${q.id}">${isFav ? '❤️' : '🤍'} 收藏</button>
              <button class="btn btn-outline note-btn" data-qid="${q.id}">📝 笔记</button>
              <button class="btn btn-danger delete-question" data-qid="${q.id}">🗑️ 删除</button>
            </div>
            ${resultHtml}
          </div>
        `;
      });
      container.innerHTML = html;

      // 绑定选项点击
      container.querySelectorAll('.opt-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const qid = parseInt(this.dataset.qid);
          const idx = parseInt(this.dataset.optidx);
          const q = allQuestions.find(q => q.id === qid);
          if (!q) return;
          const state = answerState[qid] || { selected: [], submitted: false };
          if (state.submitted) return;
          if (q.type === 'A') {
            state.selected = [idx];
          } else {
            const pos = state.selected.indexOf(idx);
            if (pos > -1) state.selected.splice(pos, 1);
            else state.selected.push(idx);
          }
          answerState[qid] = state;
          updateOptionStyles(qid);
        });
      });

      // 提交答案
      container.querySelectorAll('.submit-answer').forEach(btn => {
        btn.addEventListener('click', function() {
          const qid = parseInt(this.dataset.qid);
          const q = allQuestions.find(q => q.id === qid);
          if (!q) return;
          const state = answerState[qid] || { selected: [], submitted: false };
          if (state.submitted) return;
          if (state.selected.length === 0) { alert('请至少选择一个选项'); return; }
          state.submitted = true;
          // 错题自动收集
          const correct = q.answer.slice().sort();
          const user = state.selected.slice().sort();
          const isCorrect = correct.length === user.length && correct.every((v, i) => v === user[i]);
          if (!isCorrect) wrongSet.add(qid);
          else wrongSet.delete(qid); // 答对了可从错题本移除
          answerState[qid] = state;
          saveLocalData();
          renderQuestions();
        });
      });

      // 重做
      container.querySelectorAll('.reset-answer').forEach(btn => {
        btn.addEventListener('click', function() {
          const qid = parseInt(this.dataset.qid);
          delete answerState[qid];
          renderQuestions();
        });
      });

      // 收藏切换
      container.querySelectorAll('.fav-toggle').forEach(btn => {
        btn.addEventListener('click', function() {
          const qid = parseInt(this.dataset.qid);
          if (favSet.has(qid)) favSet.delete(qid);
          else favSet.add(qid);
          saveLocalData();
          renderQuestions();
        });
      });

      // 笔记按钮
      container.querySelectorAll('.note-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const qid = parseInt(this.dataset.qid);
          openNoteModal(qid);
        });
      });

      // 删除
      container.querySelectorAll('.delete-question').forEach(btn => {
        btn.addEventListener('click', async function() {
          const qid = parseInt(this.dataset.qid);
          const confirmed = await showConfirm('确定删除这道题目吗？');
          if (!confirmed) return;
          try {
            await deleteQuestion(qid);
            allQuestions = allQuestions.filter(q => q.id !== qid);
            wrongSet.delete(qid);
            favSet.delete(qid);
            delete notes[qid];
            saveLocalData();
            await refreshQuestions();
          } catch (e) { alert('删除失败'); }
        });
      });

      questions.forEach(q => updateOptionStyles(q.id));
    }

    function updateOptionStyles(qid) {
      const q = allQuestions.find(q => q.id === qid);
      if (!q) return;
      const state = answerState[qid] || { selected: [], submitted: false };
      const container = document.querySelector(`.q-options[data-qid="${qid}"]`);
      if (!container) return;
      const btns = container.querySelectorAll('.opt-btn');
      btns.forEach((btn, idx) => {
        btn.classList.remove('selected', 'correct', 'wrong');
        if (state.submitted) {
          if (q.answer.includes(idx)) btn.classList.add('correct');
          else if (state.selected.includes(idx)) btn.classList.add('wrong');
        } else {
          if (state.selected.includes(idx)) btn.classList.add('selected');
        }
      });
    }

    function showConfirm(message) {
      return new Promise(resolve => {
        const overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.35);z-index:1999;';
        const dialog = document.createElement('div');
        dialog.className = 'confirm-dialog';
        dialog.innerHTML = `<p>${message}</p><div class="actions"><button class="btn btn-outline" id="cCancel">取消</button><button class="btn btn-danger" id="cOk">确认</button></div>`;
        overlay.appendChild(dialog);
        document.body.appendChild(overlay);
        dialog.querySelector('#cCancel').onclick = () => { document.body.removeChild(overlay); resolve(false); };
        dialog.querySelector('#cOk').onclick = () => { document.body.removeChild(overlay); resolve(true); };
      });
    }

    // ===================== 笔记模态框 =====================
    let currentNoteQid = null;
    function openNoteModal(qid) {
      currentNoteQid = qid;
      document.getElementById('noteTextarea').value = notes[qid] || '';
      document.getElementById('noteModalOverlay').classList.add('active');
    }
    document.getElementById('closeNoteModal').addEventListener('click', () => {
      document.getElementById('noteModalOverlay').classList.remove('active');
    });
    document.getElementById('saveNoteBtn').addEventListener('click', () => {
      if (currentNoteQid) {
        notes[currentNoteQid] = document.getElementById('noteTextarea').value.trim();
        saveLocalData();
        document.getElementById('noteModalOverlay').classList.remove('active');
        renderQuestions(); // 刷新笔记图标
      }
    });

    // ===================== 随机练习 =====================
    document.getElementById('randomQuizBtn').addEventListener('click', () => {
      if (allQuestions.length === 0) { alert('题库为空'); return; }
      openQuizSetup();
    });

    function openQuizSetup() {
      const overlay = document.getElementById('quizModalOverlay');
      const box = document.getElementById('quizModalBox');
      box.innerHTML = `
        <h2>🎲 随机练习 <button class="close-btn" id="closeQuizSetup">×</button></h2>
        <div class="form-group"><label>题目数量（最多${allQuestions.length}）</label><input type="number" id="quizCount" min="1" max="${allQuestions.length}" value="10"></div>
        <div class="form-actions"><button class="btn btn-primary" id="startQuizBtn">开始练习</button></div>
      `;
      overlay.classList.add('active');
      document.getElementById('closeQuizSetup').onclick = () => overlay.classList.remove('active');
      document.getElementById('startQuizBtn').onclick = () => {
        const count = parseInt(document.getElementById('quizCount').value) || 10;
        startQuiz(count);
      };
    }

    let quizQuestions = [];
    let quizIndex = 0;
    let quizAnswers = [];

    function startQuiz(count) {
      const shuffled = [...allQuestions].sort(() => Math.random() - 0.5);
      quizQuestions = shuffled.slice(0, Math.min(count, allQuestions.length));
      quizIndex = 0;
      quizAnswers = new Array(quizQuestions.length).fill(null);
      isQuizMode = true;
      document.getElementById('quizModalOverlay').classList.remove('active');
      showQuizQuestion();
    }

    function showQuizQuestion() {
      if (quizIndex >= quizQuestions.length) {
        showQuizResult();
        return;
      }
      const q = quizQuestions[quizIndex];
      const box = document.getElementById('quizModalBox');
      box.innerHTML = `
        <div class="quiz-container">
          <div class="quiz-progress">题目 ${quizIndex+1} / ${quizQuestions.length}</div>
          <div class="quiz-question">
            <div class="q-text">${q.question}</div>
            <div class="q-options">${q.options.map((opt, idx) => {
              const letter = String.fromCharCode(65+idx);
              return `<button class="opt-btn quiz-opt" data-idx="${idx}">${letter}. ${opt}</button>`;
            }).join('')}</div>
          </div>
          <div class="quiz-actions">
            <button class="btn btn-primary" id="nextQuizBtn" disabled>下一题</button>
          </div>
        </div>
      `;
      document.getElementById('quizModalOverlay').classList.add('active');
      const opts = document.querySelectorAll('.quiz-opt');
      let selected = [];
      opts.forEach(btn => {
        btn.addEventListener('click', function() {
          const idx = parseInt(this.dataset.idx);
          if (q.type === 'A') {
            opts.forEach(b => b.classList.remove('selected'));
            this.classList.add('selected');
            selected = [idx];
          } else {
            this.classList.toggle('selected');
            const allSelected = document.querySelectorAll('.quiz-opt.selected');
            selected = Array.from(allSelected).map(b => parseInt(b.dataset.idx));
          }
          document.getElementById('nextQuizBtn').disabled = selected.length === 0;
        });
      });
      document.getElementById('nextQuizBtn').addEventListener('click', () => {
        quizAnswers[quizIndex] = selected;
        // 错题自动收集
        const correct = q.answer.slice().sort();
        const user = selected.slice().sort();
        if (correct.length !== user.length || !correct.every((v,i) => v===user[i])) {
          wrongSet.add(q.id);
        } else {
          wrongSet.delete(q.id);
        }
        saveLocalData();
        quizIndex++;
        showQuizQuestion();
      });
    }

    function showQuizResult() {
      const total = quizQuestions.length;
      let correct = 0;
      quizQuestions.forEach((q, i) => {
        const ans = quizAnswers[i] || [];
        const correctAns = q.answer.slice().sort();
        if (ans.length === correctAns.length && ans.every((v,idx) => v===correctAns[idx])) correct++;
      });
      document.getElementById('quizModalBox').innerHTML = `
        <div class="quiz-result">
          <h2>🎉 练习完成</h2>
          <p>正确率：${correct} / ${total} (${Math.round(correct/total*100)}%)</p>
          <p>错题已自动加入错题本</p>
          <button class="btn btn-primary" id="closeQuizResult">关闭</button>
        </div>
      `;
      document.getElementById('closeQuizResult').addEventListener('click', () => {
        document.getElementById('quizModalOverlay').classList.remove('active');
        isQuizMode = false;
        refreshQuestions();
      });
    }

    // ===================== 导入导出 =====================
    document.getElementById('exportBtn').addEventListener('click', () => {
      const data = JSON.stringify(allQuestions, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `kaoyan_questions_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById('importBtn').addEventListener('click', () => {
      document.getElementById('importFileInput').click();
    });

    document.getElementById('importFileInput').addEventListener('change', async function() {
      const file = this.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const data = JSON.parse(e.target.result);
          if (!Array.isArray(data)) throw new Error('格式错误');
          await saveQuestionsToAPI(data);
          alert(`成功导入 ${data.length} 道题目`);
          await loadAllQuestions();
          await refreshQuestions();
        } catch (err) {
          alert('导入失败：' + err.message);
        }
      };
      reader.readAsText(file);
      this.value = '';
    });

    // ===================== 倒计时 =====================
    function updateCountdown() {
      const target = new Date('2026-12-19T00:00:00');
      const now = new Date();
      const diff = target - now;
      if (diff <= 0) { document.getElementById('daysLeft').textContent = '🎉'; return; }
      document.getElementById('daysLeft').textContent = Math.floor(diff / (1000 * 60 * 60 * 24));
    }
    updateCountdown();
    setInterval(updateCountdown, 60000);

    // ===================== 初始化 =====================
    (async function init() {
      await loadAllQuestions();
      await refreshQuestions();
    })();
  })();
</script>
</body>
</html>
