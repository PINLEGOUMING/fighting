<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>考研题库 · 西综/政治/英语</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #e8f4f8; padding: 12px; min-height: 100vh; }
    .container { max-width: 1000px; margin: 0 auto; background: rgba(255,255,255,0.75); backdrop-filter: blur(4px); border-radius: 24px; padding: 16px 16px 24px; box-shadow: 0 8px 32px rgba(0,50,80,0.08); }

    .banner { background: linear-gradient(135deg,#b3d9f0,#d4e9fa); border-radius: 16px; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.6); }
    .banner h1 { font-size: 18px; font-weight: 600; color: #034b7a; display: flex; align-items: center; gap: 8px; }
    .banner h1 small { font-size: 14px; font-weight: 400; color: #1f6390; background: rgba(255,255,255,0.5); padding: 2px 12px; border-radius: 40px; }
    .countdown { background: rgba(255,255,255,0.7); padding: 6px 18px; border-radius: 40px; font-size: 16px; font-weight: 600; color: #034b7a; border: 1px solid rgba(255,255,255,0.6); white-space: nowrap; }

    /* 筛选栏：移动端垂直堆叠 */
    .filter-bar { background: white; padding: 14px 16px; border-radius: 16px; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; box-shadow: 0 2px 12px rgba(0,40,70,0.04); border: 1px solid rgba(180,210,230,0.3); margin-bottom: 16px; }
    .filter-group { display: flex; flex-direction: column; gap: 4px; flex: 1 0 130px; }
    .filter-group label { font-size: 13px; font-weight: 500; color: #2a5f7a; }
    .filter-group select { padding: 10px 12px; border-radius: 40px; border: 1px solid #cfe0eb; background: #f7fbfe; font-size: 15px; outline: none; -webkit-appearance: none; appearance: none; background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2220%22%20height%3D%2220%22%3E%3Cpath%20d%3D%22M5%206l5%205%205-5%22%20stroke%3D%22%23333%22%20stroke-width%3D%222%22%20fill%3D%22none%22/%3E%3C/svg%3E"); background-repeat: no-repeat; background-position: right 10px center; background-size: 16px; padding-right: 30px; }
    .filter-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; width: 100%; }
    .filter-actions button { flex: 1 1 auto; min-height: 44px; }

    /* 通用按钮：保证最小触摸面积 */
    .btn { padding: 8px 20px; border: none; border-radius: 40px; font-size: 15px; font-weight: 500; cursor: pointer; transition: all 0.15s; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.3); }
    .btn-primary { background: #4a8ab5; color: white; border-color: #3a7aa5; }
    .btn-primary:hover { background: #3a7aa5; }
    .btn-success { background: #3e9b7c; color: white; border-color: #2e8b6c; }
    .btn-success:hover { background: #2e8b6c; }
    .btn-outline { background: transparent; border: 1px solid #7fb0cc; color: #1f6390; }
    .btn-outline:hover { background: #dcecf5; }
    .btn-danger { background: #c0392b; color: white; border-color: #a93226; }
    .btn-danger:hover { background: #a93226; }
    .btn-small { padding: 6px 14px; font-size: 13px; min-height: 36px; }

    /* 题目列表 */
    .question-list { background: white; border-radius: 16px; padding: 16px 16px 24px; box-shadow: 0 2px 12px rgba(0,40,70,0.04); border: 1px solid rgba(180,210,230,0.3); min-height: 150px; }
    .question-list h2 { font-size: 17px; font-weight: 500; color: #1f6390; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .question-item { border-bottom: 1px solid #e4eff5; padding: 14px 0; position: relative; }
    .question-item:last-child { border-bottom: none; }

    .q-header { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
    .q-tag { background: #e1eff7; color: #034b7a; padding: 2px 12px; border-radius: 40px; font-size: 12px; font-weight: 500; }
    .q-type { background: #c7e0eb; color: #135b7a; font-weight: 600; padding: 2px 10px; border-radius: 30px; font-size: 12px; }
    .q-subject { color: #2a6f8a; font-weight: 500; font-size: 13px; }
    .q-chapter { color: #4a7f9a; font-size: 12px; }

    .q-text { margin: 6px 0 8px; font-size: 16px; line-height: 1.5; padding-left: 10px; border-left: 3px solid #b3d9f0; }

    /* 选项按钮：移动端独占一行，易点击 */
    .q-options { display: flex; flex-direction: column; gap: 8px; margin: 8px 0; }
    .q-options button { width: 100%; padding: 12px 16px; border-radius: 40px; border: 2px solid #cfe0eb; background: #f7fbfe; font-size: 15px; cursor: pointer; transition: 0.15s; color: #1a3a4a; text-align: left; }
    .q-options button:active { background: #e3f0f7; }
    .q-options button.selected { border-color: #4a8ab5; background: #d4e9fa; }
    .q-options button.correct { border-color: #2e8b6c; background: #c8f0d8; }
    .q-options button.wrong { border-color: #b33; background: #fdd; }

    .q-result { margin-top: 6px; font-weight: 600; font-size: 14px; }
    .q-result.correct { color: #2e8b6c; }
    .q-result.wrong { color: #b33; }

    .q-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .q-answer-display { margin-top: 6px; font-size: 13px; color: #135b7a; background: #e3f0f7; padding: 4px 12px; border-radius: 30px; display: inline-block; }

    .empty-msg { color: #6f8fa0; text-align: center; padding: 40px 0; }

    /* 模态框 */
    .modal-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,30,50,0.4); backdrop-filter: blur(3px); align-items: center; justify-content: center; z-index: 1000; }
    .modal-overlay.active { display: flex; padding: 12px; }
    .modal-box { background: white; border-radius: 24px; max-width: 700px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 24px 20px 20px; box-shadow: 0 20px 60px rgba(0,30,50,0.25); }
    .modal-box h2 { font-size: 20px; color: #034b7a; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    .close-btn { background: none; border: none; font-size: 28px; cursor: pointer; color: #7f9faf; transition: 0.2s; line-height: 1; }
    .form-row { display: flex; flex-wrap: wrap; gap: 10px 12px; margin-bottom: 12px; }
    .form-group { flex: 1 0 160px; display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 13px; font-weight: 500; color: #2a5f7a; }
    .form-group input, .form-group select, .form-group textarea { padding: 10px 14px; border-radius: 40px; border: 1px solid #cfe0eb; background: #f7fbfe; font-size: 14px; outline: none; }
    .form-group textarea { border-radius: 16px; min-height: 50px; }
    .options-editor { background: #f2f8fc; border-radius: 16px; padding: 14px 16px; margin: 8px 0 12px; border: 1px solid #d4e4ed; }
    .opt-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .opt-row input { flex: 1; padding: 10px 14px; border-radius: 40px; border: 1px solid #cfe0eb; background: white; }
    .opt-row button { background: none; border: none; color: #b33; font-size: 22px; cursor: pointer; padding: 0 4px; min-height: 44px; }
    .add-opt-btn { background: #c3def0; border: none; border-radius: 40px; padding: 6px 16px; font-size: 14px; cursor: pointer; color: #034b7a; min-height: 44px; }

    .sub-questions-area { margin: 10px 0; border-top: 1px dashed #cfe0eb; padding-top: 12px; }
    .sub-question-row { background: #f7fbfe; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; border: 1px solid #d4e4ed; }
    .sub-question-row .sq-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .sub-question-row .sq-header button { background: none; border: none; color: #b33; font-size: 20px; cursor: pointer; }
    .sub-question-row textarea { width: 100%; border-radius: 12px; border: 1px solid #cfe0eb; padding: 8px 12px; font-size: 14px; }
    .sq-answers { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 6px; }
    .sq-answers label { font-size: 14px; }

    .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
    .form-actions button { min-width: 80px; }

    /* 删除确认弹窗 */
    .confirm-dialog { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; border-radius: 20px; padding: 20px 24px; box-shadow: 0 16px 48px rgba(0,0,0,0.25); z-index: 2000; display: flex; flex-direction: column; gap: 12px; max-width: 320px; width: 90%; }
    .confirm-dialog p { font-size: 15px; color: #1a3a4a; }
    .confirm-dialog .actions { display: flex; gap: 8px; justify-content: flex-end; }
  </style>
</head>
<body>
<div class="container">
  <div class="banner">
    <h1>📚 考研题库 <small>西综 · 政治 · 英语</small></h1>
    <div class="countdown">⏳ 距考研 <span id="daysLeft">--</span> 天</div>
  </div>

  <div class="filter-bar">
    <div class="filter-group"><label>📌 科目</label><select id="subjectFilter"><option value="">全部</option><option value="西医综合">西医综合</option><option value="政治">政治</option><option value="英语">英语</option></select></div>
    <div class="filter-group"><label>📂 二级分类</label><select id="subFilter"><option value="">全部</option></select></div>
    <div class="filter-group"><label>📖 章节</label><select id="chapterFilter"><option value="">全部</option></select></div>
    <div class="filter-actions">
      <button class="btn btn-primary" id="filterBtn">🔍 筛选</button>
      <button class="btn btn-success" id="addBtn">➕ 录入题目</button>
    </div>
  </div>

  <div class="question-list">
    <h2><span>📝 题目列表</span><span id="resultCount">0 道题</span></h2>
    <div id="questionsContainer"><div class="empty-msg">加载中...</div></div>
  </div>
</div>

<!-- 录入/编辑模态框 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h2>✏️ 录入题目 <button class="close-btn" id="closeModalBtn">×</button></h2>
    <form id="questionForm">
      <div class="form-row">
        <div class="form-group"><label>科目 *</label><select id="inputSubject" required><option value="西医综合">西医综合</option><option value="政治">政治</option><option value="英语">英语</option></select></div>
        <div class="form-group"><label>二级分类</label><input type="text" id="inputSub" placeholder="如：内科学"></div>
        <div class="form-group"><label>章节</label><input type="text" id="inputChapter" placeholder="如：呼吸系统"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>题型 *</label>
          <select id="inputType" required>
            <option value="A">A型（单选）</option>
            <option value="X">X型（多选）</option>
            <option value="B">B型（多题干共用选项）</option>
          </select>
        </div>
      </div>
      <div class="options-editor">
        <label style="font-weight:500; display:block; margin-bottom:8px;">公共选项</label>
        <div id="optionsContainer">
          <div class="opt-row"><input type="text" class="opt-input" placeholder="选项 A" value=""><button type="button" class="remove-opt" style="display:none;">✕</button></div>
          <div class="opt-row"><input type="text" class="opt-input" placeholder="选项 B" value=""><button type="button" class="remove-opt" style="display:none;">✕</button></div>
          <div class="opt-row"><input type="text" class="opt-input" placeholder="选项 C" value=""><button type="button" class="remove-opt" style="display:none;">✕</button></div>
        </div>
        <button type="button" class="add-opt-btn" id="addOptionBtn">➕ 添加选项</button>
      </div>
      <div id="questionInputArea">
        <div class="form-group"><label>题干 *</label><textarea id="inputQuestion" rows="2" placeholder="请输入题目内容..."></textarea></div>
        <div class="form-group"><label>正确答案（可多选）</label><div id="answerCheckboxes"></div></div>
      </div>
      <div id="subQuestionsArea" style="display:none;" class="sub-questions-area">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <span style="font-weight:500; color:#034b7a;">📋 子题干列表</span>
          <button type="button" class="btn btn-outline btn-small" id="addSubQuestionBtn">➕ 添加子题干</button>
        </div>
        <div id="subQuestionsContainer"></div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-outline" id="cancelModalBtn">取消</button>
        <button type="submit" class="btn btn-primary">💾 保存题目</button>
      </div>
    </form>
  </div>
</div>

<script>
  (function() {
    // ===================== 全局状态 =====================
    let questions = [];
    const answerState = {};

    // ===================== API 封装 =====================
    async function fetchQuestions(filters = {}) {
      const params = new URLSearchParams(filters);
      const res = await fetch(`/api/questions?${params.toString()}`);
      if (!res.ok) throw new Error(`加载失败: ${res.status}`);
      return await res.json();
    }

    async function saveQuestionsToAPI(questionsArray) {
      const res = await fetch('/api/questions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(questionsArray),
      });
      if (!res.ok) throw new Error(`保存失败: ${res.status}`);
      return await res.json();
    }

    async function deleteQuestion(id) {
      const res = await fetch(`/api/questions?id=${id}`, {
        method: 'DELETE',
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({ error: '删除失败' }));
        throw new Error(err.error || '删除失败');
      }
    }

    // ===================== 自定义确认对话框（移动端友好） =====================
    function showConfirm(message) {
      return new Promise((resolve) => {
        const overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.35);z-index:1999;';
        const dialog = document.createElement('div');
        dialog.className = 'confirm-dialog';
        dialog.innerHTML = `
          <p>${message}</p>
          <div class="actions">
            <button class="btn btn-outline btn-small" id="confirmCancel">取消</button>
            <button class="btn btn-danger btn-small" id="confirmOk">确认删除</button>
          </div>
        `;
        overlay.appendChild(dialog);
        document.body.appendChild(overlay);

        dialog.querySelector('#confirmCancel').addEventListener('click', () => {
          document.body.removeChild(overlay);
          resolve(false);
        });
        dialog.querySelector('#confirmOk').addEventListener('click', () => {
          document.body.removeChild(overlay);
          resolve(true);
        });
      });
    }

    // ===================== 加载 & 渲染 =====================
    async function loadAndRender(filters = {}) {
      try {
        questions = await fetchQuestions(filters);
        renderQuestions();
        updateSubFilterOptions();
        updateChapterFilterOptions();
      } catch (e) {
        document.getElementById('questionsContainer').innerHTML = `<div class="empty-msg">加载失败：${e.message}</div>`;
      }
    }

    function renderQuestions() {
      const container = document.getElementById('questionsContainer');
      const resultCount = document.getElementById('resultCount');
      resultCount.textContent = questions.length + ' 道题';
      if (questions.length === 0) {
        container.innerHTML = '<div class="empty-msg">没有匹配的题目。</div>';
        return;
      }

      let html = '';
      questions.forEach(q => {
        const typeLabel = q.type === 'A' ? 'A型' : q.type === 'X' ? 'X型' : 'B型';
        const optionsHtml = q.options.map((opt, idx) => {
          const letter = String.fromCharCode(65 + idx);
          return `<button data-qid="${q.id}" data-optidx="${idx}" class="opt-btn">${letter}. ${opt}</button>`;
        }).join('');
        const state = answerState[q.id] || { selected: [], submitted: false };
        const selected = state.selected || [];
        const submitted = state.submitted || false;

        let resultHtml = '';
        if (submitted) {
          const correct = q.answer.slice().sort();
          const user = selected.slice().sort();
          const isCorrect = correct.length === user.length && correct.every((v, i) => v === user[i]);
          resultHtml = `<div class="q-result ${isCorrect ? 'correct' : 'wrong'}">${isCorrect ? '✅ 回答正确！' : '❌ 回答错误'}</div>`;
          const correctText = q.answer.map(i => String.fromCharCode(65 + i)).join('、');
          resultHtml += `<div class="q-answer-display">✅ 正确答案：${correctText}</div>`;
        }

        html += `
          <div class="question-item" data-qid="${q.id}">
            <div class="q-header">
              <span class="q-tag">${q.subject}</span>
              <span class="q-subject">${q.subCategory || '未分类'}</span>
              <span class="q-chapter">${q.chapter || '无章节'}</span>
              <span class="q-type">${typeLabel}</span>
            </div>
            <div class="q-text">${q.question}</div>
            <div class="q-options" data-qid="${q.id}">${optionsHtml}</div>
            <div class="q-actions">
              <button class="btn btn-primary submit-answer" data-qid="${q.id}">📤 提交答案</button>
              ${submitted ? `<button class="btn btn-outline reset-answer" data-qid="${q.id}">🔄 重做</button>` : ''}
              <button class="btn btn-danger delete-question" data-qid="${q.id}">🗑️ 删除</button>
            </div>
            ${resultHtml}
          </div>
        `;
      });
      container.innerHTML = html;

      // 绑定选项点击
      container.querySelectorAll('.opt-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const qid = parseInt(this.dataset.qid);
          const idx = parseInt(this.dataset.optidx);
          const q = questions.find(q => q.id === qid);
          if (!q) return;
          const state = answerState[qid] || { selected: [], submitted: false };
          if (state.submitted) return;
          if (q.type === 'A') {
            state.selected = [idx];
          } else {
            const pos = state.selected.indexOf(idx);
            if (pos > -1) state.selected.splice(pos, 1);
            else state.selected.push(idx);
          }
          answerState[qid] = state;
          updateOptionStyles(qid);
        });
      });

      // 提交答案
      container.querySelectorAll('.submit-answer').forEach(btn => {
        btn.addEventListener('click', function() {
          const qid = parseInt(this.dataset.qid);
          const q = questions.find(q => q.id === qid);
          if (!q) return;
          const state = answerState[qid] || { selected: [], submitted: false };
          if (state.submitted) return;
          if (state.selected.length === 0) { alert('请至少选择一个选项'); return; }
          state.submitted = true;
          answerState[qid] = state;
          renderQuestions();
        });
      });

      // 重做
      container.querySelectorAll('.reset-answer').forEach(btn => {
        btn.addEventListener('click', function() {
          const qid = parseInt(this.dataset.qid);
          delete answerState[qid];
          renderQuestions();
        });
      });

      // 删除按钮
      container.querySelectorAll('.delete-question').forEach(btn => {
        btn.addEventListener('click', async function() {
          const qid = parseInt(this.dataset.qid);
          const q = questions.find(q => q.id === qid);
          if (!q) return;
          const confirmed = await showConfirm(`确定要删除这道题目吗？\n\n${q.question.substring(0, 30)}...`);
          if (!confirmed) return;
          try {
            await deleteQuestion(qid);
            questions = questions.filter(q => q.id !== qid);
            renderQuestions();
            updateSubFilterOptions();
            updateChapterFilterOptions();
          } catch (e) {
            alert('删除失败：' + e.message);
          }
        });
      });

      questions.forEach(q => updateOptionStyles(q.id));
    }

    function updateOptionStyles(qid) {
      const q = questions.find(q => q.id === qid);
      if (!q) return;
      const state = answerState[qid] || { selected: [], submitted: false };
      const selected = state.selected || [];
      const submitted = state.submitted || false;
      const container = document.querySelector(`.q-options[data-qid="${qid}"]`);
      if (!container) return;
      const btns = container.querySelectorAll('.opt-btn');
      btns.forEach((btn, idx) => {
        btn.classList.remove('selected', 'correct', 'wrong');
        if (submitted) {
          if (q.answer.includes(idx)) btn.classList.add('correct');
          else if (selected.includes(idx)) btn.classList.add('wrong');
        } else {
          if (selected.includes(idx)) btn.classList.add('selected');
        }
      });
    }

    // ===================== 筛选下拉 =====================
    function updateSubFilterOptions() {
      const subject = document.getElementById('subjectFilter').value;
      const set = new Set();
      questions.forEach(q => { if (!subject || q.subject === subject) if (q.subCategory) set.add(q.subCategory); });
      const subs = Array.from(set).sort();
      const sel = document.getElementById('subFilter');
      sel.innerHTML = '<option value="">全部二级分类</option>' + subs.map(v => `<option value="${v}">${v}</option>`).join('');
    }

    function updateChapterFilterOptions() {
      const subject = document.getElementById('subjectFilter').value;
      const sub = document.getElementById('subFilter').value;
      const set = new Set();
      questions.forEach(q => {
        if ((!subject || q.subject === subject) && (!sub || q.subCategory === sub)) {
          if (q.chapter) set.add(q.chapter);
        }
      });
      const chaps = Array.from(set).sort();
      const sel = document.getElementById('chapterFilter');
      sel.innerHTML = '<option value="">全部章节</option>' + chaps.map(v => `<option value="${v}">${v}</option>`).join('');
    }

    document.getElementById('subjectFilter').addEventListener('change', () => {
      updateSubFilterOptions();
      updateChapterFilterOptions();
    });
    document.getElementById('subFilter').addEventListener('change', updateChapterFilterOptions);

    document.getElementById('filterBtn').addEventListener('click', function() {
      const filters = {
        subject: document.getElementById('subjectFilter').value,
        subCategory: document.getElementById('subFilter').value,
        chapter: document.getElementById('chapterFilter').value
      };
      for (let key in answerState) delete answerState[key];
      loadAndRender(filters);
    });

    // ===================== 录入模态框 =====================
    const modalOverlay = document.getElementById('modalOverlay');
    const addBtn = document.getElementById('addBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const cancelModalBtn = document.getElementById('cancelModalBtn');
    const questionForm = document.getElementById('questionForm');
    const inputType = document.getElementById('inputType');
    const optionsContainer = document.getElementById('optionsContainer');
    const addOptionBtn = document.getElementById('addOptionBtn');
    const answerCheckboxes = document.getElementById('answerCheckboxes');
    const questionInputArea = document.getElementById('questionInputArea');
    const subQuestionsArea = document.getElementById('subQuestionsArea');
    const subQuestionsContainer = document.getElementById('subQuestionsContainer');
    const addSubQuestionBtn = document.getElementById('addSubQuestionBtn');
    const inputQuestion = document.getElementById('inputQuestion'); // 单题干输入框

    function updateAnswerCheckboxes(container = answerCheckboxes) {
      const optInputs = document.querySelectorAll('.opt-input');
      const count = optInputs.length;
      let html = '';
      for (let i = 0; i < count; i++) {
        const label = String.fromCharCode(65 + i);
        html += `<label><input type="checkbox" class="answer-chk" value="${i}"> ${label}</label>`;
      }
      container.innerHTML = html || '<span style="color:#7f9faf;">请先添加选项</span>';
    }

    function updateAllSubAnswerCheckboxes() {
      const rows = subQuestionsContainer.querySelectorAll('.sub-question-row');
      rows.forEach(row => {
        const container = row.querySelector('.sq-answers');
        if (container) updateAnswerCheckboxes(container);
      });
    }

    function addOptionRow(value = '') {
      const row = document.createElement('div');
      row.className = 'opt-row';
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'opt-input';
      input.placeholder = `选项 ${String.fromCharCode(65 + document.querySelectorAll('.opt-input').length)}`;
      input.value = value;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'remove-opt';
      btn.textContent = '✕';
      btn.style.display = 'inline-block';
      btn.addEventListener('click', function() {
        if (document.querySelectorAll('.opt-row').length > 2) {
          row.remove();
          updateAnswerCheckboxes();
          updateAllSubAnswerCheckboxes();
        } else alert('至少保留两个选项');
      });
      row.appendChild(input);
      row.appendChild(btn);
      optionsContainer.appendChild(row);
      updateAnswerCheckboxes();
      updateAllSubAnswerCheckboxes();
    }

    addOptionBtn.addEventListener('click', () => addOptionRow(''));
    optionsContainer.addEventListener('input', function(e) {
      if (e.target.classList.contains('opt-input')) {
        updateAnswerCheckboxes();
        updateAllSubAnswerCheckboxes();
      }
    });

    // 切换题型，修复 B 型无法提交的问题
    function toggleQuestionArea() {
      const type = inputType.value;
      if (type === 'B') {
        questionInputArea.style.display = 'none';
        subQuestionsArea.style.display = 'block';
        inputQuestion.disabled = true;   // 禁用隐藏的必填项，防止表单验证拦截
        if (subQuestionsContainer.children.length === 0) {
          addSubQuestionRow();
          addSubQuestionRow();
        }
      } else {
        questionInputArea.style.display = 'block';
        subQuestionsArea.style.display = 'none';
        inputQuestion.disabled = false;  // 恢复
        updateAnswerCheckboxes();
      }
    }

    function addSubQuestionRow(questionText = '', answers = []) {
      const row = document.createElement('div');
      row.className = 'sub-question-row';
      const header = document.createElement('div');
      header.className = 'sq-header';
      const label = document.createElement('label');
      label.textContent = `子题干 ${subQuestionsContainer.children.length + 1}`;
      const delBtn = document.createElement('button');
      delBtn.textContent = '✕';
      delBtn.type = 'button';
      delBtn.addEventListener('click', function() {
        if (subQuestionsContainer.children.length > 1) {
          row.remove();
          subQuestionsContainer.querySelectorAll('.sq-header label').forEach((l, idx) => l.textContent = `子题干 ${idx + 1}`);
        } else alert('至少保留一个子题干');
      });
      header.appendChild(label);
      header.appendChild(delBtn);
      const textarea = document.createElement('textarea');
      textarea.rows = 2;
      textarea.placeholder = '请输入子题干内容...';
      textarea.value = questionText;
      const ansDiv = document.createElement('div');
      ansDiv.className = 'sq-answers';
      row.appendChild(header);
      row.appendChild(textarea);
      row.appendChild(ansDiv);
      subQuestionsContainer.appendChild(row);
      updateAnswerCheckboxes(ansDiv);
      if (answers.length) {
        const chks = ansDiv.querySelectorAll('.answer-chk');
        answers.forEach(idx => { if (chks[idx]) chks[idx].checked = true; });
      }
      subQuestionsContainer.querySelectorAll('.sq-header label').forEach((l, idx) => l.textContent = `子题干 ${idx + 1}`);
    }

    addSubQuestionBtn.addEventListener('click', () => addSubQuestionRow());
    inputType.addEventListener('change', toggleQuestionArea);

    function openModal() {
      document.getElementById('inputSubject').value = '西医综合';
      document.getElementById('inputSub').value = '';
      document.getElementById('inputChapter').value = '';
      inputType.value = 'A';
      optionsContainer.innerHTML = '';
      addOptionRow('');
      addOptionRow('');
      subQuestionsContainer.innerHTML = '';
      inputQuestion.value = '';
      inputQuestion.disabled = false;   // 重置状态
      updateAnswerCheckboxes();
      toggleQuestionArea();
      modalOverlay.classList.add('active');
    }

    addBtn.addEventListener('click', openModal);
    closeModalBtn.addEventListener('click', () => modalOverlay.classList.remove('active'));
    cancelModalBtn.addEventListener('click', () => modalOverlay.classList.remove('active'));
    modalOverlay.addEventListener('click', function(e) { if (e.target === modalOverlay) modalOverlay.classList.remove('active'); });

    // 提交录入
    questionForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      const subject = document.getElementById('inputSubject').value;
      const subCategory = document.getElementById('inputSub').value.trim();
      const chapter = document.getElementById('inputChapter').value.trim();
      const type = inputType.value;
      const optInputs = document.querySelectorAll('.opt-input');
      const options = Array.from(optInputs).map(inp => inp.value.trim()).filter(v => v !== '');
      if (options.length < 2) { alert('至少需要两个选项'); return; }

      let toSave = [];
      if (type === 'B') {
        const rows = subQuestionsContainer.querySelectorAll('.sub-question-row');
        if (rows.length === 0) { alert('请添加至少一个子题干'); return; }
        for (const row of rows) {
          const textarea = row.querySelector('textarea');
          const question = textarea.value.trim();
          if (!question) { alert('所有子题干不能为空'); return; }
          const chks = row.querySelectorAll('.sq-answers .answer-chk:checked');
          const answer = Array.from(chks).map(cb => parseInt(cb.value));
          if (answer.length === 0) { alert(`子题干 "${question}" 未选择答案`); return; }
          toSave.push({ subject, subCategory, chapter, type, question, options: options.slice(), answer });
        }
      } else {
        const question = inputQuestion.value.trim();
        if (!question) { alert('请输入题干'); return; }
        const chks = document.querySelectorAll('#answerCheckboxes .answer-chk:checked');
        const answer = Array.from(chks).map(cb => parseInt(cb.value));
        if (answer.length === 0) { alert('请选择正确答案'); return; }
        toSave.push({ subject, subCategory, chapter, type, question, options: options.slice(), answer });
      }

      try {
        await saveQuestionsToAPI(toSave);
        alert('题目保存成功！');
        modalOverlay.classList.remove('active');
        const filters = {
          subject: document.getElementById('subjectFilter').value,
          subCategory: document.getElementById('subFilter').value,
          chapter: document.getElementById('chapterFilter').value
        };
        await loadAndRender(filters);
      } catch (e) {
        alert('保存失败：' + e.message);
      }
    });

    // ===================== 倒计时 =====================
    function updateCountdown() {
      const target = new Date('2026-12-19T00:00:00');
      const now = new Date();
      const diff = target - now;
      if (diff <= 0) { document.getElementById('daysLeft').textContent = '🎉'; return; }
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      document.getElementById('daysLeft').textContent = days;
    }
    updateCountdown();
    setInterval(updateCountdown, 60000);

    // 初始加载
    loadAndRender();
  })();
</script>
</body>
</html>
